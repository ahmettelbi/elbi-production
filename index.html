<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elbi Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --surface:#17171A;
    --text:#F3F1EA;
    --muted:#8A8A8F;
    --accent:#C9A15A;
    --line:#2A2A2E;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;}

  .display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;}

  /* ---------- left rail ---------- */
  .rail{
    position:fixed;left:0;top:0;bottom:0;
    width:84px;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(11,11,13,.95),rgba(11,11,13,.82));
    border-right:1px solid var(--line);
    z-index:20;
  }
  .brand{font-size:15px;line-height:1;text-align:center;margin-bottom:24px;color:var(--text);}
  .brand span{display:block;color:var(--accent);font-size:10px;letter-spacing:.2em;margin-top:2px;font-family:'Inter';font-weight:600;}

  .sectors{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;overflow-y:auto;}
  .sector-btn{
    width:64px;padding:10px 4px;border:none;background:none;color:var(--muted);
    cursor:pointer;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:background .15s,color .15s;
  }
  .sector-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .15s,transform .15s;}
  .sector-btn span{font-size:10.5px;line-height:1.15;text-align:center;}
  .sector-btn.active{background:var(--surface);color:var(--text);}
  .sector-btn.active .dot{background:var(--accent);transform:scale(1.3);}
  .sector-btn:hover{color:var(--text);}

  .sector-group{width:100%;display:flex;flex-direction:column;align-items:center;}
  .org-list{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;
    padding:2px 0 8px;margin-top:-2px;}
  .org-btn{
    width:68px;border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:10px;line-height:1.2;text-align:center;padding:5px 2px;border-radius:7px;
    border-left:2px solid var(--line);
  }
  .org-btn.active{color:var(--accent);border-left-color:var(--accent);background:var(--surface);}
  .org-btn:hover{color:var(--text);}

  /* ---------- feed ---------- */
  .feed{
    margin-left:84px;height:100%;
    overflow-y:scroll;scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .slide{
    height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:#000;border-bottom:1px solid var(--line);
  }
  .video-wrap{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;}
  .video-wrap iframe{width:100%;height:100%;border:0;display:block;background:#000;}

  .meta{
    position:absolute;left:0;right:0;bottom:0;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));
    pointer-events:none;
  }
  .meta .tag{
    display:inline-block;font-size:11px;letter-spacing:.14em;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-bottom:10px;
    font-weight:600;
  }
  .meta h2{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em;}
  .meta p{margin:0;color:var(--muted);font-size:13.5px;max-width:34ch;}

  /* empty placeholder slide */
  .placeholder{
    height:100%;width:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--muted);text-align:center;padding:0 40px;
  }
  .placeholder .ring{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);margin-bottom:6px;}
  .placeholder b{color:var(--text);font-weight:600;}

  .empty-state{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--muted);text-align:center;padding:0 40px;
  }
  .empty-state .display{font-size:40px;color:var(--text);}

  /* scrollbar hide */
  .feed::-webkit-scrollbar{display:none;}
  .feed{scrollbar-width:none;}

  @media (max-width:420px){
    .rail{width:64px;}
    .sector-btn{width:52px;}
    .feed{margin-left:64px;}
    .meta h2{font-size:21px;}
  }
</style>
</head>
<body>

<nav class="rail">
  <div class="brand display">ELBİ<span>PRODUCTION</span></div>
  <div class="sectors" id="sectors"></div>
</nav>

<main class="feed" id="feed"></main>

<script>
/* =====================================================================
   VİDEO EKLEMEK İÇİN: aşağıdaki VIDEOS dizisine yeni bir satır ekle.
   youtubeId: YouTube linkindeki "v=" kısmından sonraki kod
   (örn. youtube.com/watch?v=ABC123xyz -> youtubeId: "ABC123xyz")
   sector: "saglikreels" | "egitim" | "sanayi"  (yeni sektör de eklenebilir,
   SECTORS listesine de eklemeyi unutma)
   ===================================================================== */

const SECTORS = [
  { id: 'tumu',        label: 'Tümü' },
  { id: 'saglikreels', label: 'Sağlıkreels' },
  { id: 'egitim',      label: 'Eğitim' },
  { id: 'sanayi',      label: 'Sanayi Tanıtım' },
];

const VIDEOS = [
  // org: videonun çekildiği kurum/marka adı (opsiyonel). Aynı sektörde birden
  // fazla farklı org varsa, o sektör butonunun altında otomatik alt liste açılır.
  { title: 'Eğitim İçeriği 1', sector: 'egitim', org: '', youtubeId: 'nwKrOPRkH38', desc: '' },
  { title: 'Eğitim İçeriği 2', sector: 'egitim', org: '', youtubeId: 'QVnO_DdlaJQ', desc: '' },
  { title: 'Eğitim İçeriği 3', sector: 'egitim', org: '', youtubeId: 'LIVncVSq8as', desc: '' },

  { title: 'Başkent Hastanesi — Reels 1', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'AQL2BDiCn0U', desc: '' },
  { title: 'Başkent Hastanesi — Reels 2', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'hy0QWKsm2Wo', desc: '' },
  { title: 'Başkent Hastanesi — Reels 3', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'SRP3ug0bedY', desc: '' },
  { title: 'Başkent Hastanesi — Reels 4', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'Il9oDXrfxN0', desc: '' },
  { title: 'Başkent Hastanesi — Reels 5', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'lKFFNESnmdE', desc: '' },
  { title: 'Başkent Hastanesi — Reels 6', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'f-JLK3qsvNE', desc: '' },
  { title: 'Başkent Hastanesi — Reels 7', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'PIw7bHcGl58', desc: '' },
  { title: 'Başkent Hastanesi — Reels 8', sector: 'saglikreels', org: 'Başkent Hastanesi', youtubeId: 'e_KagUgWgT8', desc: '' },
  { title: 'Kışla Yerleşkesi — Reels 1', sector: 'saglikreels', org: 'Kışla Yerleşkesi', youtubeId: 'kv598S07n4w', desc: '' },
];

const feedEl = document.getElementById('feed');
const sectorsEl = document.getElementById('sectors');
let activeSector = 'tumu';
let activeOrg = null;
let expandedSector = null;

function orgsFor(sectorId){
  return [...new Set(VIDEOS.filter(v=>v.sector===sectorId && v.org).map(v=>v.org))];
}

function renderSectors(){
  sectorsEl.innerHTML = SECTORS.map(s => {
    const orgs = s.id==='tumu' ? [] : orgsFor(s.id);
    const open = expandedSector===s.id && orgs.length>0;
    const orgHtml = open ? `
      <div class="org-list">
        <button class="org-btn ${activeOrg===null?'active':''}" data-org="">Tümü</button>
        ${orgs.map(o=>`<button class="org-btn ${activeOrg===o?'active':''}" data-org="${o}">${o}</button>`).join('')}
      </div>` : '';
    return `
      <div class="sector-group">
        <button class="sector-btn ${s.id===activeSector?'active':''}" data-id="${s.id}">
          <span class="dot"></span><span>${s.label}</span>
        </button>
        ${orgHtml}
      </div>`;
  }).join('');

  sectorsEl.querySelectorAll('.sector-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(activeSector===id){
        expandedSector = expandedSector===id ? null : id;
        activeOrg = null;
      } else {
        activeSector = id; activeOrg = null;
        expandedSector = orgsFor(id).length>0 ? id : null;
      }
      renderSectors(); renderFeed();
    });
  });
  sectorsEl.querySelectorAll('.org-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      activeOrg = btn.dataset.org || null;
      renderSectors(); renderFeed();
    });
  });
}

function renderFeed(){
  let list = activeSector==='tumu' ? VIDEOS : VIDEOS.filter(v=>v.sector===activeSector);
  if(activeOrg) list = list.filter(v=>v.org===activeOrg);

  if(list.length===0){
    feedEl.innerHTML = `
      <div class="empty-state">
        <div class="display">HENÜZ VİDEO YOK</div>
        <p>Bu sektörde video eklemek için sayfanın kodundaki <b>VIDEOS</b> listesine
        YouTube linkini ekle. Bana linki gönderirsen senin için ekleyebilirim.</p>
      </div>`;
    return;
  }

  feedEl.innerHTML = list.map(v => `
    <section class="slide">
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/${v.youtubeId}?rel=0&modestbranding=1&playsinline=1"
          title="${v.title}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen loading="lazy"></iframe>
        <div class="meta" style="pointer-events:none;">
          <span class="tag">${sectorLabel(v.sector)}${v.org ? ' · '+v.org : ''}</span>
          <h2>${v.title}</h2>
          <p>${v.desc||''}</p>
        </div>
      </div>
    </section>
  `).join('');
}

function sectorLabel(id){
  const s = SECTORS.find(s=>s.id===id);
  return s ? s.label : id;
}

renderSectors();
renderFeed();
</script>
</body>
</html>
